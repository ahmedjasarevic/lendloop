services:
  n8n:
    image: n8nio/n8n:latest
    container_name: lendloop-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      # Local http on localhost; n8n's secure cookie default would block login.
      N8N_SECURE_COOKIE: "false"
      # $env access is how the workflows read secrets without embedding them.
      # On n8n Cloud (where $env is blocked) use instance variables instead.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      LENDLOOP_CONVEX_SITE_URL: ${LENDLOOP_CONVEX_SITE_URL}
      LENDLOOP_WEBHOOK_SECRET: ${LENDLOOP_WEBHOOK_SECRET}
      LENDLOOP_CALLBACK_SECRET: ${LENDLOOP_CALLBACK_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
